name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build shared foundations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Keep the build inside lean-action so its cache is saved after compiling.
      - name: Build the pinned library and save compiled files
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: 'HilbertMathlib'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'

      - name: Check public signatures, source provenance and axioms
        run: python3 verification/verify.py

      - name: Upload declaration audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-foundation-verification
          path: |
            .scratch/PublicSignatures.lean
            .scratch/public-signatures.txt
            .scratch/verification-status.json
          if-no-files-found: ignore
